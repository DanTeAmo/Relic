<!doctype html>
<meta charset="utf-8">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#f7f7f7">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Relict</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500&display=swap">
<style>
  /* ============================================================
     RELICT — editorial redesign, v2
     System modelled on mouthwash.studio: warm-neutral paper (#f7f7f7),
     pure black type, one grey for secondary text, a tight grotesque with
     -0.03em tracking, 2px radii, tag pills in translucent grey, a huge
     wordmark footer. Light theme only, regardless of OS setting.
     ============================================================ */
  :root{
    --bg: #f7f7f7;
    --bg-2: #ececea;
    --bg-3: #f7f7f7;
    --label: #000000;
    --label-2: #6a6b66;          /* 4.8:1 on --bg — secondary text */
    --label-3: #6a6b66;
    --muted-lg: #8c8d87;         /* large type only (>=24px) */
    --sep: rgba(0,0,0,.16);
    --sep-strong: rgba(0,0,0,.26);
    --accent: #000000;
    --accent-ink: #f7f7f7;
    --accent-soft: rgba(220,220,220,.5);
    --tag: rgba(220,220,220,.55);

    --radius-lg: 2px; --radius-md: 2px; --radius-sm: 2px;
    --pw: clamp(16px, 3.2vw, 32px);
    --gap: clamp(8px, 1.4vw, 20px);
    --font: "Inter Tight", "Suisse BP Intl", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --size-body: clamp(15px, 1.25vw, 18px);
    --size-small: 14px;
    --size-statement: clamp(26px, 3.1vw, 40px);
    --ease: cubic-bezier(.22,.9,.3,1);
    --ease-in: cubic-bezier(.5,0,.75,0);
    --d-default: .25s; --d-long: .35s; --d-longer: .666s;
    --photo-tone: saturate(.82) contrast(1.03);   /* one grade for every photograph */
    color-scheme: light only;
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html{ scroll-behavior: auto; }
  html, body{ min-height: 100%; }
  body{
    background: var(--bg); color: var(--label);
    font-family: var(--font); font-size: var(--size-body); line-height: 1.1; letter-spacing: -0.03em;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  a{ color: inherit; text-decoration: none; }
  h1,h2,h3,h4{ font-weight: 400; letter-spacing: -0.035em; line-height: .95; text-wrap: balance; margin: 0; }
  p{ margin: 0 0 1em; }
  ul,ol{ margin:0; padding:0; list-style:none; }
  button{ font: inherit; letter-spacing: inherit; color: inherit; background: none; border: none; cursor: pointer; padding: 0; }
  input, select{ font: inherit; letter-spacing: inherit; color: inherit; background: none; border: none; outline: none; }
  ::selection{ background: var(--label); color: var(--bg); }
  :focus-visible{ outline: 1px solid var(--label); outline-offset: 3px; border-radius: 2px; }
  img, canvas, svg{ max-width: 100%; }
  .mono{ font-family: var(--font-mono); letter-spacing: 0; }
  .tabular{ font-variant-numeric: tabular-nums; }
  .vh{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; }
  .skip{ position:fixed; left: var(--pw); top: -60px; z-index: 300; background: var(--label); color: var(--bg); padding: 8px 10px; border-radius: 3px; transition: top .2s; }
  .skip:focus{ top: 12px; }

  /* ---------- photographs ---------- */
  img.ph{ display:block; width:100%; height:100%; object-fit:cover; opacity:0; transform: scale(1.05);
    filter: blur(16px) var(--photo-tone); user-select:none; -webkit-user-drag:none;
    transition: opacity 1s ease, transform 1.4s var(--ease), filter 1.2s var(--ease); }
  img.ph.instant{ transition:none !important; }
  img.ph.loaded{ opacity:1; transform:none; filter: var(--photo-tone); }
  @media (hover:hover){ a.card:hover img.ph.loaded{ transform: scale(1.04); transition-duration: 1.1s, 1.1s, 1.1s; } }

  /* ---------- shell ---------- */
  #shell{ position: relative; min-height: 100vh; display: flex; flex-direction: column; }
  #shell > main{ flex: 1 0 auto; }
  .wrap{ width:100%; padding-left: var(--pw); padding-right: var(--pw); }
  main.wrap{ padding-top: calc(var(--pw) + 56px); }

  /* header: fixed; a frosted fade appears behind it once the page scrolls */
  header.top{ position: fixed; inset: 0 0 auto 0; z-index: 50; padding: var(--pw) 0 0; pointer-events:none; transition: opacity var(--d-long); }
  header.top::before{ content:""; position:absolute; left:0; right:0; top:0; bottom:-22px; z-index:-1; opacity:0; transition: opacity .4s ease;
    background: linear-gradient(180deg, rgba(247,247,247,.94) 0%, rgba(247,247,247,.86) 62%, rgba(247,247,247,0) 100%);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    -webkit-mask-image: linear-gradient(#000 70%, transparent); mask-image: linear-gradient(#000 70%, transparent); }
  body.scrolled header.top::before{ opacity:1; }
  header.top a, header.top button, header.top .seg{ pointer-events: auto; }
  .topbar{ display:flex; align-items:flex-start; gap: var(--gap); }
  .brand{ font-size: clamp(26px, 2.4vw, 39px); letter-spacing: -0.04em; line-height: .88; width: 16.667%; min-width: 96px; transition: opacity var(--d-default); }
  .brand .dot{ display:none; }
  @media (hover:hover){ .brand:hover{ opacity:.5; } }
  nav.tabs{ display:flex; gap: 4px; flex-wrap:wrap; align-items:flex-start; }
  nav.tabs a, .chrome-controls .ctl{
    font-size: var(--size-body); line-height: .9; padding: 5px 7px 4px; border-radius: 3px; background: transparent;
    transition: color var(--d-default), background-color var(--d-default), transform .15s;
    display:inline-flex; align-items:center; justify-content:center; white-space:nowrap;
  }
  nav.tabs a.active{ background: var(--tag); }
  @media (hover:hover){ nav.tabs a:hover, .chrome-controls .ctl:hover{ background: var(--tag); } }
  nav.tabs a:active, .chrome-controls .ctl:active{ transform: scale(.985); }
  .chrome-controls{ margin-left:auto; display:flex; align-items:flex-start; gap: 4px; }
  .seg{ display:flex; gap:4px; }
  .seg button{ font-size: var(--size-body); line-height:.9; padding: 5px 7px 4px; border-radius:3px; color: var(--label-2); transition: background-color var(--d-default), color var(--d-default); }
  .seg button.active{ color: var(--label); background: var(--tag); }
  @media (hover:hover){ .seg button:hover{ color: var(--label); } }
  .icon-btn{ width: 27px; height: 22px; display:flex; align-items:center; justify-content:center; border-radius:3px; color: var(--label); transition: background-color var(--d-default); }
  .icon-btn:hover, .icon-btn.on{ background: var(--tag); }
  .icon-btn svg{ width:15px; height:15px; }
  @media (max-width: 767px){
    .brand{ width:auto; min-width:0; margin-right: 6px; }
    .topbar{ flex-wrap: wrap; row-gap: 10px; }
    nav.tabs{ order: 3; width:100%; }
    #randomBtn, #ambientToggle, #copyMail{ display:none; }
    main.wrap{ padding-top: calc(var(--pw) + 84px); }
    header.top::before{ bottom:-12px; }
  }

  /* footer: giant wordmark + info columns */
  footer.colophon{ margin-top: clamp(80px, 14vw, 200px); border-top: 1px solid var(--label); padding-top: 14px; }
  .foot-contact{ font-size: var(--size-statement); line-height: .9; margin-bottom: clamp(60px, 12vw, 180px); }
  .foot-contact .muted{ display:block; color: var(--muted-lg); transition: color var(--d-default); }
  .foot-contact a:hover .muted, .foot-contact a:hover{ color: var(--label); }
  .foot-mark{ display:block; font-size: 30vw; line-height: .74; letter-spacing: -0.06em; white-space: nowrap; font-weight: 500; margin-left: -.04em; overflow:hidden; padding-top: .02em; user-select:none; }
  .foot-mark span{ display:inline-block; transform: translateY(100%); transition: transform 1.1s var(--ease); }
  .foot-mark.in span{ transform:none; }
  .foot-grid{ display:grid; grid-template-columns: repeat(6,1fr); gap: var(--gap); font-size: var(--size-small); line-height: 1.1; padding: 22px 0 calc(var(--pw) + env(safe-area-inset-bottom,0px)); }
  .foot-grid > :nth-child(2){ grid-column: 3 / span 2; }
  .foot-grid > :nth-child(3){ grid-column: 6; text-align:right; }
  @media (max-width: 767px){ .foot-grid{ grid-template-columns: 1fr 1fr; } .foot-grid > :nth-child(2){ grid-column: auto; } .foot-grid > :nth-child(3){ grid-column: 1 / -1; text-align:left; } .foot-mark{ font-size: 29vw; } }

  /* ---------- shared bits ---------- */
  .eyebrow{ font-size: var(--size-small); color: var(--label-2); margin-bottom: 12px; letter-spacing:-0.02em; }
  .btn{ display:inline-flex; align-items:center; gap:6px; padding: 8px 10px 7px; border-radius: 3px; font-size: var(--size-body); line-height:.95; transition: background-color var(--d-default), color var(--d-default), transform .15s; }
  .btn.primary{ background: var(--label); color: var(--bg); }
  .btn.secondary{ background: var(--tag); color: var(--label); }
  @media (hover:hover){ .btn.primary:hover{ background: #3a3a38; } .btn.secondary:hover{ background: var(--sep-strong); } }
  .btn:active{ transform: scale(.985); }
  .chip{ font-size: 13px; line-height: 1; letter-spacing: -0.02em; padding: 5px 7px 5px; background: var(--tag); border-radius: 3px; color: var(--label); white-space: nowrap; display:inline-flex; align-items:center; }

  /* card: image + caption + tag row */
  .card{ display:flex; flex-direction:column; gap: 10px; background: none; border-radius: 0; overflow: visible; }
  .card .thumb{ position:relative; aspect-ratio: 4/5; background: var(--bg-2); overflow:hidden; border-radius: 2px; }
  .card .thumb.wide{ aspect-ratio: 4/3; }
  .badge-ring{ position:absolute; top:10px; right:10px; width:48px; height:48px; filter: drop-shadow(0 1px 6px rgba(0,0,0,.35)); }
  .badge-ring canvas{ width:100%; height:100%; display:block; }
  .ring-label{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:2px; pointer-events:none; }
  .ring-label strong{ font-size:1.9rem; font-weight:400; letter-spacing:-0.04em; font-variant-numeric: tabular-nums; }
  .ring-label span{ font-size:.68rem; color:var(--label-2); letter-spacing:-0.01em; }
  .ring-label.badge{ inset:auto; top:10px; right:10px; width:48px; height:48px; color:#fff; }
  .ring-label.badge strong{ font-size: .95rem; color:#fff; }
  .ring-label.badge span{ font-size:.42rem; color: rgba(255,255,255,.85); }
  .card .body{ padding: 0; display:flex; flex-direction:column; gap:6px; flex:1; }
  .card .top-line{ display:flex; justify-content: space-between; gap: 8px; font-size: var(--size-small); color: var(--label-2); order: 2; }
  .card h3{ font-size: var(--size-body); line-height: 1; letter-spacing: -0.03em; order: 1; }
  .card .hook{ color: var(--label-2); font-size: var(--size-small); line-height: 1.12; margin: 0; order: 3; max-width: 36ch; }
  .card .chips{ display:flex; gap:4px; flex-wrap:wrap; margin-top: auto; padding-top: 4px; order: 4; }

  section.band{ padding-block: clamp(40px, 6vw, 96px) 0; border: none; }
  .band-head{ display:grid; grid-template-columns: repeat(12, 1fr); gap: var(--gap); align-items:start; margin-bottom: clamp(20px, 3vw, 40px); }
  .band-head h2{ font-size: var(--size-statement); line-height: .92; grid-column: 1 / span 4; letter-spacing:-0.04em; }
  .band-head .note{ color: var(--label-2); font-size: var(--size-body); line-height:1.1; max-width: 34ch; margin: 0; grid-column: 7 / span 4; }
  @media (max-width: 767px){ .band-head h2, .band-head .note{ grid-column: 1 / -1; } }

  .featured-grid{ display:grid; grid-template-columns: repeat(12, 1fr); gap: calc(var(--gap) * 2) var(--gap); align-items:start; }
  .featured-grid .card:nth-child(4n+1){ grid-column: 1 / span 7; }
  .featured-grid .card:nth-child(4n+2){ grid-column: 9 / span 4; margin-top: clamp(32px, 9vw, 140px); }
  .featured-grid .card:nth-child(4n+3){ grid-column: 1 / span 5; }
  .featured-grid .card:nth-child(4n+4){ grid-column: 7 / span 6; margin-top: clamp(32px, 7vw, 110px); }
  .featured-grid .card:nth-child(4n+1) .thumb, .featured-grid .card:nth-child(4n+4) .thumb{ aspect-ratio: 4/3; }
  @media (max-width: 767px){ .featured-grid{ grid-template-columns: 1fr; } .featured-grid .card{ grid-column: 1 / -1 !important; margin-top: 0 !important; } .featured-grid .card .thumb{ aspect-ratio: 4/5 !important; } }

  /* ---------- home ---------- */
  .home-gallery{ position:relative; width: 100%; aspect-ratio: 16/9; max-height: 66vh; min-height: 260px; background: var(--bg-2); border-radius: 2px; overflow:hidden; cursor: pointer; }
  .hg-item{ position:absolute; inset:0; opacity:0; transition: opacity 1s var(--ease); }
  .hg-item.is-active{ opacity:1; }
  .hg-item::after{ content:""; position:absolute; inset:0; background: linear-gradient(0deg, rgba(0,0,0,.38), rgba(0,0,0,0) 38%); pointer-events:none; }
  .hg-desc{ position:absolute; left: 16px; bottom: 14px; z-index:3; color:#fff; font-size: var(--size-small); line-height:1.1; letter-spacing:-0.02em; pointer-events:none; text-shadow: 0 1px 10px rgba(0,0,0,.35); }
  .hg-desc b{ font-weight:400; display:block; font-size: 16px; }
  .hg-count{ position:absolute; right:16px; bottom:14px; z-index:3; color:#fff; font-size:var(--size-small); letter-spacing:-0.02em; font-variant-numeric: tabular-nums; text-shadow: 0 1px 10px rgba(0,0,0,.35); }
  .hg-nav{ position:absolute; inset:0; z-index:2; display:flex; justify-content:space-between; pointer-events:none; }
  .hg-nav button{ flex:0 0 28%; pointer-events:auto; opacity:0; }
  .hg-nav .prev{ cursor: w-resize; } .hg-nav .next{ cursor: e-resize; }
  @media (max-width: 767px){ .home-gallery{ aspect-ratio: 4/5; max-height: none; } .hg-nav button{ flex-basis: 34%; } }
  .home-statement{ font-size: var(--size-statement); line-height: .98; letter-spacing: -0.035em; max-width: 24em; margin: clamp(28px, 5vw, 72px) 0 0; }
  .home-statement a{ color: var(--muted-lg); transition: color var(--d-default); }
  @media (hover:hover){ .home-statement a:hover{ color: var(--label); } }
  .stat-row{ display:grid; grid-template-columns: repeat(3, 1fr); gap: var(--gap); padding-top: 14px; border-top: 1px solid var(--label); }
  .stat-row .stat b{ display:block; font-weight:400; font-size: var(--size-statement); letter-spacing: -0.04em; line-height:.9; font-variant-numeric: tabular-nums; margin-bottom: 8px; }
  .stat-row .stat span{ color: var(--label-2); font-size: var(--size-body); }
  .more-link{ display:inline-block; margin-top: clamp(28px,4vw,56px); font-size: var(--size-statement); line-height:.9; color: var(--muted-lg); transition: color var(--d-default); }
  .more-link:hover{ color: var(--label); }

  /* ---------- index rows (list view) ---------- */
  .rows{ border-top: 1px solid var(--label); }
  .row{ display:grid; grid-template-columns: 6% 1.6fr 1fr 1fr 90px 110px; gap: var(--gap); align-items:baseline; padding: 14px 0 13px; border-bottom: 1px solid var(--sep); font-size: var(--size-body); transition: opacity .3s ease; }
  .row .r-name{ font-size: clamp(18px, 1.9vw, 26px); letter-spacing:-0.04em; line-height:.95; }
  .row .r-n, .row .r-c, .row .r-t, .row .r-y, .row .r-d{ color: var(--label-2); font-size: var(--size-small); }
  .row .r-y, .row .r-d{ text-align:right; font-variant-numeric: tabular-nums; }
  @media (hover:hover){ .rows:hover .row{ opacity:.32; } .rows .row:hover{ opacity:1; } }
  @media (max-width: 767px){ .row{ grid-template-columns: 1fr auto; } .row .r-n, .row .r-t, .row .r-d{ display:none; } .row .r-c{ grid-column: 1; } .row .r-y{ grid-row: 1; grid-column: 2; } }
  #peek{ position: fixed; left:0; top:0; z-index: 400; width: clamp(200px, 20vw, 300px); aspect-ratio: 4/3; pointer-events:none; opacity:0; border-radius:2px; overflow:hidden; background: var(--bg-2);
    clip-path: inset(0 0 100% 0); transition: opacity .25s ease, clip-path .5s var(--ease); will-change: transform; box-shadow: 0 10px 40px rgba(0,0,0,.18); }
  #peek.on{ opacity:1; clip-path: inset(0 0 0 0); }
  #peek img{ width:100%; height:100%; object-fit:cover; display:block; filter: var(--photo-tone); }
  @media (hover:none){ #peek{ display:none; } }

  /* ---------- tiles (explore) ---------- */
  .tile-grid{ display:grid; grid-template-columns: repeat(4, 1fr); gap: var(--gap); margin: 0; }
  .tile{ background: var(--bg-2); padding: 12px; display:flex; flex-direction:column; justify-content:space-between; min-height: clamp(180px, 22vw, 320px); border-radius: 2px; transition: background-color var(--d-long), color var(--d-long); position:relative; overflow:hidden; }
  .tile:hover{ background: var(--label); color: var(--bg); }
  .tile:hover .tdesc, .tile:hover .tnum{ color: rgba(247,247,247,.7); }
  .tile .tnum{ font-size: var(--size-small); color: var(--label-2); transition: color var(--d-long); }
  .tile .tname{ font-size: var(--size-statement); line-height:.9; display:flex; align-items:flex-start; gap:8px; letter-spacing:-0.04em; }
  .tile .tname svg{ width:18px; height:18px; opacity:0; transform: translate(-4px,4px); transition: all .25s var(--ease); flex-shrink:0; margin-top:4px; }
  .tile:hover .tname svg{ opacity:1; transform:none; }
  .tile .tdesc{ font-size: var(--size-small); line-height:1.12; color: var(--label-2); margin-top: 10px; max-width: 28ch; transition: color var(--d-long); }
  @media (max-width: 900px){ .tile-grid{ grid-template-columns: repeat(2,1fr); } }
  @media (max-width: 560px){ .tile-grid{ grid-template-columns: 1fr; } }

  /* ---------- inner pages ---------- */
  section h1{ font-size: var(--size-statement) !important; line-height: .92; letter-spacing:-0.04em; margin-bottom: 0 !important; }
  section p.lead{ color: var(--muted-lg) !important; font-size: var(--size-statement) !important; line-height: .98; letter-spacing:-0.035em; max-width: 22em !important; margin: 16px 0 clamp(36px,6vw,80px) !important; }
  .back-link{ display:inline-flex; align-items:center; gap:6px; color: var(--label-2); font-size: var(--size-body); margin: 0 0 18px; transition: color var(--d-default); }
  .back-link:hover{ color: var(--label); }
  .back-link span{ display:none; }
  .site-banner{ position:relative; width:100%; height: min(56.25vw, 78vh); border-radius: 2px; overflow:hidden; margin: 0 0 24px; background: var(--bg-2); }
  .site-banner .fade{ position:absolute; inset:0; background: linear-gradient(0deg, rgba(0,0,0,.55), rgba(0,0,0,0) 52%); }
  .site-banner .overlay{ position:absolute; left:0; right:0; bottom:0; padding: 18px; color:#fff; }
  .site-banner .overlay .eyebrow{ color:#fff; opacity:.85; }
  .site-banner .overlay h1{ font-size: clamp(40px, 8vw, 120px) !important; color:#fff; letter-spacing:-0.05em; line-height:.86; }
  .site-banner .overlay .meta{ color: rgba(255,255,255,.9); margin-top:10px; font-size: var(--size-body); }
  .site-banner .badge-ring{ top:auto; bottom:18px; right:18px; width:72px; height:72px; }
  .site-banner .ring-label.badge{ top:auto; bottom:18px; right:18px; width:72px; height:72px; }
  .site-banner .ring-label.badge strong{ font-size:1.3rem; }
  .site-banner .ring-label.badge span{ font-size:.5rem; }
  .photo-credit{ position:absolute; top:12px; right:14px; z-index:3; color:#fff; font-size:12px; opacity:.85; text-shadow:0 1px 6px rgba(0,0,0,.55); max-width:60%; text-align:right; transition: opacity .25s; }
  .photo-credit:hover{ opacity:1; text-decoration:underline; }
  @media (max-width: 760px){ .site-banner{ height: 125vw; max-height: 78vh; } }
  .chips{ display:flex; gap:4px; flex-wrap:wrap; }
  .stat-grid{ display:grid; grid-template-columns: repeat(auto-fit,minmax(130px,1fr)); gap: 18px var(--gap); padding: 14px 0 22px; border-top: 1px solid var(--label); margin-bottom: clamp(36px,6vw,80px); }
  .stat-grid div span{ display:block; font-size: var(--size-small); color: var(--label-2); margin-bottom: 6px; }
  .stat-grid div b{ font-size: clamp(20px,2vw,28px); font-weight:400; letter-spacing:-0.04em; font-variant-numeric: tabular-nums; }
  .site-body{ display:grid; grid-template-columns: 1.4fr 1fr; gap: clamp(32px,6vw,96px); }
  .site-body h2{ font-size: var(--size-small); color: var(--label-2); margin-bottom: 14px; letter-spacing:-0.02em; line-height:1; }
  .site-body section{ margin-bottom: 44px; font-size: clamp(17px,1.5vw,22px); line-height:1.08; }
  .site-body section p{ max-width: 34em; }
  .timeline-list{ display:flex; flex-direction:column; gap: 12px; }
  .timeline-list li{ display:flex; gap: 14px; font-size: var(--size-body); line-height:1.1; padding-top:10px; border-top: 1px solid var(--sep); }
  .timeline-list .yr{ flex: 0 0 56px; color: var(--label-2); font-variant-numeric: tabular-nums; }
  .field-note{ background: var(--bg-2); border-radius: 2px; padding: 16px; font-size: var(--size-body); line-height:1.15; color: var(--label); }
  .data-list{ display:flex; flex-direction:column; gap: 10px; font-size: var(--size-body); }
  .data-list div{ display:flex; justify-content: space-between; gap: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--sep); }
  .data-list div span:first-child{ color: var(--label-2); }
  .disclaimer{ font-size: 13px; color: var(--label-2); margin-top: -4px; }

/* ---------- ring visualization ---------- */
function drawRing(canvas, frac, opts){
  opts = opts || {};
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  const size = canvas.clientWidth || canvas.parentElement.clientWidth || 160;
  canvas.width = size * dpr; canvas.height = size * dpr;
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,size,size);
  const cx = size/2, cy = size/2, r = size/2 - (opts.stroke||10)/2 - 2;
  const track = opts.track || cssVar('--sep-strong') || 'rgba(120,120,120,.3)';
  const accent = opts.accent || cssVar('--accent') || '#9c5b22';
  const stroke = opts.stroke || 10;
  ctx.lineCap = 'round';
  ctx.lineWidth = stroke;
  ctx.strokeStyle = track;
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.stroke();
  const start = -Math.PI/2;
  const end = start + Math.PI*2*Math.max(0.012, Math.min(1, frac));
  try{
    const grad = ctx.createConicGradient(start, cx, cy);
    grad.addColorStop(0, accent); grad.addColorStop(1, accent);
    ctx.strokeStyle = accent;
  }catch(e){ ctx.strokeStyle = accent; }
  ctx.beginPath(); ctx.arc(cx,cy,r,start,end); ctx.stroke();
}
function mountRings(root){
  root.querySelectorAll('canvas[data-ring]').forEach(canvas => {
    const site = byId(canvas.dataset.ring);
    if(!site) return;
    const now = new Date().getFullYear();
    const total = Math.max(1, now - site.founded);
    const dormant = Math.max(0, now - site.abandoned);
    const frac = Math.min(1, dormant/total);
    drawRing(canvas, frac, { stroke: canvas.dataset.thick ? 12 : 8, accent:'#fff', track:'rgba(255,255,255,.35)' });
  });
}

let hgTimer = null;
function initHomeGallery(root){
  clearInterval(hgTimer); hgTimer = null;
  const g = root.querySelector('#homeGallery');
  if(!g) return;
  const items = [...g.querySelectorAll('.hg-item')];
  const desc = g.querySelector('#hgDesc'), count = g.querySelector('#hgCount');
  let i = 0;
  function show(n){
    i = (n + items.length) % items.length;
    items.forEach((el,k) => el.classList.toggle('is-active', k===i));
    const s = byId(items[i].dataset.site);
    desc.innerHTML = `<b>${esc(L(s).name)}</b>${esc(L(s).country)}, ${s.abandoned}`;
    count.textContent = String(i+1).padStart(2,'0') + ' / ' + String(items.length).padStart(2,'0');
  }
  function arm(){ clearInterval(hgTimer); hgTimer = setInterval(() => { if(!document.body.contains(g)) clearInterval(hgTimer); else if(!document.hidden) show(i+1); }, 4800); }
  g.querySelector('.prev').addEventListener('click', e => { e.stopPropagation(); show(i-1); arm(); });
  g.querySelector('.next').addEventListener('click', e => { e.stopPropagation(); show(i+1); arm(); });
  g.addEventListener('click', () => { location.hash = '#site-' + items[i].dataset.site; });
  show(0); arm();
}

function matchesFilter(site){
  const s = L(site);
  if(registerState.continent!=='all' && site.continent!==registerState.continent) return false;
  if(registerState.category!=='all' && site.category!==registerState.category) return false;
  if(registerState.q){
    const hay = (s.name+' '+s.country+' '+s.hook).toLowerCase();
    if(!hay.includes(registerState.q.toLowerCase())) return false;
  }
  return true;
}
function sortedSites(list){
  const now = new Date().getFullYear();
  const arr = list.slice();
  if(registerState.sort==='name') arr.sort((a,b) => L(a).name.localeCompare(L(b).name, LANG));
  else if(registerState.sort==='abandoned') arr.sort((a,b) => a.abandoned - b.abandoned);
  else if(registerState.sort==='dormant') arr.sort((a,b) => (now-b.abandoned) - (now-a.abandoned));
  return arr;
}
function renderRegisterGrid(){
  const grid = document.getElementById('registerGrid');
  if(!grid) return;
  const results = sortedSites(SITES.filter(matchesFilter));
  const list = registerState.view === 'list';
  grid.innerHTML = results.length ? results.map(list ? rowHTML : cardHTML).join('') : `<p class="empty-note">${esc(t('noResults'))}</p>`;
  grid.className = results.length ? (list ? 'rows' : 'grid') : '';
  mountRings(grid); primeImages(grid); observeReveals(grid);
}

function wireRegisterEvents(){
  const search = document.getElementById('regSearch');
  if(search) search.addEventListener('input', e => { registerState.q = e.target.value; renderRegisterGrid(); });
  document.querySelectorAll('#regContinent .filter-chip').forEach(btn => btn.addEventListener('click', () => {
    registerState.continent = btn.dataset.val;
    document.querySelectorAll('#regContinent .filter-chip').forEach(b => b.classList.toggle('active', b===btn));
    renderRegisterGrid();
  }));
  document.querySelectorAll('#regCategory .filter-chip').forEach(btn => btn.addEventListener('click', () => {
    registerState.category = btn.dataset.val;
    document.querySelectorAll('#regCategory .filter-chip').forEach(b => b.classList.toggle('active', b===btn));
    renderRegisterGrid();
  }));
  document.querySelectorAll('#regView .filter-chip').forEach(btn => btn.addEventListener('click', () => {
    registerState.view = btn.dataset.val;
    document.querySelectorAll('#regView .filter-chip').forEach(b => b.classList.toggle('active', b===btn));
    renderRegisterGrid();
  }));
  const sortSel = document.getElementById('regSort');
  if(sortSel) sortSel.addEventListener('change', e => { registerState.sort = e.target.value; renderRegisterGrid(); });
  renderRegisterGrid();
}

function viewSite(id){
  const site = byId(id);
  if(!site) return `<p style="padding-top:60px;">404</p>`;
  const s = L(site);
  const now = new Date().getFullYear();
  const dormant = now - site.abandoned;
  const active = site.abandoned - site.founded;
  const ph = PHOTOS[site.id] || [];
  const credit = n => ph[n] ? `<a href="${ph[n].url}" target="_blank" rel="noopener">${tr('Фото','Photo')}: ${esc(ph[n].by)}, ${esc(ph[n].lic)}</a>` : '';
  const gallery = ph.length > 2 ? `<div class="d-gallery">
    <figure class="g1" data-reveal><div class="fr">${imgHTML(site, 1, '(max-width:760px) 100vw, 62vw')}</div><figcaption>${credit(1)}</figcaption></figure>
    <figure class="g2" data-reveal><div class="fr">${imgHTML(site, 2, '(max-width:760px) 100vw, 32vw')}</div><figcaption>${credit(2)}</figcaption></figure>
  </div>` : '';
  const at = SITES.findIndex(x => x.id === site.id);
  const prevS = SITES[(at - 1 + SITES.length) % SITES.length], nextS = SITES[(at + 1) % SITES.length];
  const related = SITES.filter(x => x.id!==site.id && x.continent===site.continent).slice(0,3)
    .concat(SITES.filter(x => x.id!==site.id && x.continent!==site.continent)).slice(0,3);
  return `
  <a class="back-link" href="#register"><span aria-hidden="true">←</span> ${esc(t('backToRegister'))}</a>
  <div class="site-banner">
    ${imgHTML(site, 0, '100vw', {eager:true})}
    ${(PHOTOS[site.id]||[])[0] ? `<a class="photo-credit" href="${PHOTOS[site.id][0].url}" target="_blank" rel="noopener">${tr('Фото','Photo')}: ${esc(PHOTOS[site.id][0].by)}, ${esc(PHOTOS[site.id][0].lic)}</a>` : ''}

      <div class="eyebrow">${esc(t('heroEyebrow'))}${String(siteIndex(site.id)).padStart(2,'0')}</div>

      <p class="meta">${esc(s.country)} · ${esc(continentName(site.continent))}</p>
    </div>
    <div class="badge-ring"><canvas data-ring="${site.id}" data-thick="1" aria-hidden="true"></canvas></div>
    <div class="ring-label badge"><strong>${fmtInt(dormant)}</strong><span>${esc(t('yearsDormant'))}</span></div>
  </div>
  <div class="chips" style="margin:0 0 30px;">
    <span class="chip status">${esc(s.statusLabel)}</span>
    <span class="chip">${esc(categoryName(site.category))}</span>

  <div class="stat-grid">
    <div><span>${esc(t('founded'))}</span><b>${site.founded}</b></div>
    <div><span>${esc(t('abandonedLbl'))}</span><b>${site.abandoned}</b></div>
    <div><span>${esc(t('peakLbl'))}</span><b>${fmtInt(site.peak)}</b></div>
    <div><span>${esc(t('dormantLbl'))}</span><b>${fmtInt(dormant)}</b></div>
    <div><span>${esc(t('surveyedLbl'))}</span><b>${site.surveyed}</b></div>
  </div>
  <div class="site-body">
    <div>
      <section>
        <h2>${esc(t('historyHead'))}</h2>
        ${s.history.map(p => `<p>${esc(p)}</p>`).join('')}
      </section>
      <section>
        <h2>${esc(t('fieldNoteHead'))}</h2>
        <div class="field-note">${esc(s.fieldNote)}</div>

    </div>
    <div>
      <section>
        <h2>${esc(t('timelineHead'))}</h2>

      </section>
      <section>
        <h2>${esc(t('dataHead'))}</h2>
        <div class="data-list">
          <div><span>${esc(t('coordLbl'))}</span><span class="mono">${site.lat.toFixed(4)}, ${site.lng.toFixed(4)}</span></div>

          <div><span>${esc(t('categoryLbl'))}</span><span>${esc(categoryName(site.category))}</span></div>
          <div><span>${esc(t('yearsActive'))}</span><span>${active}</span></div>

  </div>
  ${related.length ? `<section class="band" style="border-bottom:none; padding-top:8px;">
    <div class="band-head"><h2>${esc(t('relatedHead'))}</h2></div>
    <div class="related-grid">${related.map(cardHTML).join('')}</div>
  </section>` : ''}
  `;
}

function projectEq(lat, lng, w, h){
  const x = (lng + 180) / 360 * w;
  const y = (90 - lat) / 180 * h;
  return [x, y];
}

const MAP_W = 1000, MAP_H = 500;
const mapView = { x:0, y:0, k:1 };
function viewChart(){
  const pins = SITES.map(site => {
    const [x,y] = projectEq(site.lat, site.lng, MAP_W, MAP_H);
    return `<g class="map-pin" data-id="${site.id}" style="--cc:${CONTINENT_COLOR[site.continent]}" transform="translate(${x.toFixed(1)} ${y.toFixed(1)})" tabindex="0" role="button" aria-label="${esc(L(site).name)}">
      <circle class="halo" r="13"/><circle class="dot" r="5"/>
    </g>`;
  }).join('');
  const now = new Date().getFullYear();
  const bars = sortedSites(SITES.slice()).slice().sort((a,b) => (now-b.abandoned)-(now-a.abandoned));
  const maxDormant = Math.max(...bars.map(s => now-s.abandoned));
  return `
  <section style="padding-top:40px;">
    <h1 style="font-size:2.25rem; margin-bottom:10px;" data-reveal>${esc(t('chartTitle'))}</h1>
    <p class="lead" style="color:var(--label-2); font-size:1.0625rem; margin-bottom:20px; max-width:56ch;" data-reveal>${esc(t('chartLead'))}</p>
    <div class="map-wrap" id="mapWrap" data-reveal="scale">
      <div class="map-stage" id="mapStage">
        <svg id="mapSvg" viewBox="0 0 ${MAP_W} ${MAP_H}" role="img" aria-label="${esc(t('chartTitle'))}">
          <rect x="0" y="0" width="${MAP_W}" height="${MAP_H}" fill="var(--bg-3)"/>
          <g id="mapViewport">
            <path class="land" d="${WORLD_LAND_PATH}" fill-rule="evenodd"/>
            ${pins}
          </g>
        </svg>
        <div class="map-controls">
          <button id="mapZoomIn" aria-label="${esc(t('mapZoomIn'))}" title="${esc(t('mapZoomIn'))}">+</button>
          <button id="mapZoomOut" aria-label="${esc(t('mapZoomOut'))}" title="${esc(t('mapZoomOut'))}">−</button>
          <button id="mapReset" aria-label="${esc(t('mapReset'))}" title="${esc(t('mapReset'))}">⟲</button>
        </div>
      </div>
      <div class="map-pop" id="mapPop"></div>
    </div>
    <div class="legend" data-reveal>${Object.keys(CONTINENT_LABEL).map(c => `<span>${esc(continentName(c))}<b>${SITES.filter(x => x.continent===c).length}</b></span>`).join('')}</div>
    <p class="map-hint" data-reveal>${esc(t('mapHint'))}</p>
    <div class="band-head" style="margin-top:46px;" data-reveal><h2>${esc(t('chartDormantHead'))}</h2></div>
    <div class="bars">
      ${bars.map((s,i) => `<div class="bar-row" data-reveal style="transition-delay:${Math.min(i*35,350)}ms"><span class="name">${esc(L(s).name)}</span><div class="bar-track"><div class="bar-fill" style="width:${((now-s.abandoned)/maxDormant*100).toFixed(1)}%"></div></div><span class="val">${now-s.abandoned}</span></div>`).join('')}
    </div>
  </section>`;
}
function applyMapTransform(){
  const g = document.getElementById('mapViewport');
  if(g) g.setAttribute('transform', `translate(${mapView.x} ${mapView.y}) scale(${mapView.k})`);
}
function clampMapView(){
  const maxPanX = MAP_W*(mapView.k-1) + 60;
  const maxPanY = MAP_H*(mapView.k-1) + 60;
  mapView.x = Math.min(maxPanX, Math.max(-maxPanX, mapView.x));
  mapView.y = Math.min(maxPanY, Math.max(-maxPanY, mapView.y));
}
function hideMapPopover(){
  const pop = document.getElementById('mapPop');
  if(pop) pop.classList.remove('show');
  document.querySelectorAll('.map-pin.active').forEach(p => p.classList.remove('active'));
}
function showMapPopover(site, pinEl){
  const wrap = document.getElementById('mapWrap');
  const pop = document.getElementById('mapPop');
  if(!wrap || !pop) return;
  document.querySelectorAll('.map-pin.active').forEach(p => p.classList.remove('active'));
  pinEl.classList.add('active');
  const dot = pinEl.querySelector('.dot');
  const dotRect = dot.getBoundingClientRect();
  const stageRect = wrap.getBoundingClientRect();
  const s = L(site);
  pop.innerHTML = `<div class="mp-img">${imgHTML(site, 0, '230px', {eager:true})}</div>
    <div class="mpname">${esc(s.name)}</div>
    <div class="mpmeta">${esc(s.country)} · ${site.abandoned}</div>
    <a href="#site-${site.id}">${esc(t('mapOpen'))}</a>`;
  primeImages(pop);
  // Flip below the pin when there isn't room above (near the top of the
  // stage), and keep the card from overflowing the stage's left/right edge.
  const dotX = dotRect.left + dotRect.width/2 - stageRect.left;
  const dotY = dotRect.top - stageRect.top;
  const popH = pop.offsetHeight, popW = pop.offsetWidth;
  const below = dotY < popH + 24;
  pop.classList.toggle('below', below);
  const clampedX = Math.min(Math.max(dotX, popW/2 + 8), stageRect.width - popW/2 - 8);
  pop.style.left = clampedX + 'px';
  pop.style.top = dotY + 'px';
  pop.classList.add('show');

  stage.addEventListener('click', e => { if(!e.target.closest('.map-pin') && !moved) hideMapPopover(); });
}

/* ---------- router ---------- */
const ROUTES = {
  atlas: viewAtlas, register: viewRegister, chart: viewChart, guide: viewGuide, dispatch: viewDispatch
};
function titleFor(hash){
  if(hash.startsWith('site-')){ const s = byId(hash.slice(5)); return s ? `${L(s).name} — RELICT` : 'RELICT'; }
  const map = { atlas:'atlasTitle', register:'registerTitle', chart:'chartTitle', guide:'guideTitle', dispatch:'dispatchTitle' };
  return map[hash] ? `${t(map[hash])} — RELICT` : 'RELICT';
}
function renderRoute(){
  const hash = (location.hash || '#atlas').slice(1);
  const app = document.getElementById('app');
  if(hash.startsWith('site-')){
    app.innerHTML = viewSite(hash.slice(5));
  } else if(ROUTES[hash]){
    app.innerHTML = ROUTES[hash]();
    if(hash === 'register') wireRegisterEvents();
    if(hash === 'chart') initMap();
    if(hash === 'dispatch'){
      const btn = document.getElementById('copyAddrBtn');
      if(btn) btn.addEventListener('click', () => {
        navigator.clipboard?.writeText('dossier@relict.archive').then(() => {
          const orig = btn.textContent; btn.textContent = t('copied');
          setTimeout(() => { btn.textContent = orig; }, 1800);
        }).catch(()=>{});
      });
    }
  } else {
    app.innerHTML = ROUTES.atlas();
  }
  mountRings(app); primeImages(app); observeReveals(app); wireMagnetic(app); initHomeGallery(app);
  document.title = titleFor(hash);
  document.querySelectorAll('nav.tabs a').forEach(a => {
    a.classList.toggle('active', a.getAttribute('href') === '#'+(ROUTES[hash] ? hash : 'atlas') || (hash.startsWith('site-') && a.getAttribute('href')==='#register'));
  });
}
let firstRoute = true, sharedThumb = null;
document.addEventListener('click', e => {
  if(e.defaultPrevented || e.button || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
  const a = e.target.closest && e.target.closest('a.card');
  const th = a && a.querySelector('.thumb');
  if(th){ th.style.viewTransitionName = 'site-hero'; sharedThumb = th; }
}, true);
function route(){
  const app = document.getElementById('app');
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches || document.documentElement.dataset.motion === 'off';
  if(firstRoute || reduced){
    firstRoute = false; sharedThumb = null;
    renderRoute();
    window.scrollTo({ top:0, behavior:'instant' in window ? 'instant' : 'auto' });
    requestAnimationFrame(() => app.classList.add('entered'));
    return;
  }
  /* card -> dossier: the photograph travels (View Transitions API), everything else cross-fades */
  if(document.startViewTransition && sharedThumb && location.hash.startsWith('#site-')){
    sharedThumb = null;
    const vt = document.startViewTransition(async () => {
      renderRoute();
      window.scrollTo(0, 0);
      app.classList.remove('leaving','entering'); app.classList.add('entered');
      const b = app.querySelector('.site-banner');
      if(b){
        b.style.viewTransitionName = 'site-hero';
        const im = b.querySelector('img.ph');
        if(im){
          await Promise.race([(im.decode ? im.decode() : Promise.resolve()).catch(() => {}), new Promise(r => setTimeout(r, 1400))]);
          im.classList.add('instant', 'loaded');
        }
      }
    });
    vt.finished.finally(() => { document.querySelectorAll('.site-banner, .thumb').forEach(el => { el.style.viewTransitionName = ''; }); });
    return;
  }
  document.querySelectorAll('.thumb').forEach(el => { el.style.viewTransitionName = ''; }); sharedThumb = null;
  app.classList.add('leaving');
  setTimeout(() => {
    renderRoute();
    window.scrollTo({ top:0, behavior:'instant' in window ? 'instant' : 'auto' });
    app.classList.remove('leaving','entered');
    app.classList.add('entering');
    requestAnimationFrame(() => requestAnimationFrame(() => {
      app.classList.remove('entering'); app.classList.add('entered');
    }));
  }, 260);
}

/* ---------- chrome ---------- */
function renderChrome(){
  const tabs = document.getElementById('tabs');
  const nav = STR[LANG].nav;
  tabs.innerHTML = Object.entries(nav).map(([key,label]) => `<a href="#${key}">${esc(label)}</a>`).join('');
  document.querySelectorAll('#langSwitch button').forEach(btn => btn.classList.toggle('active', btn.dataset.lang===LANG));
  const randomBtn = document.getElementById('randomBtn');
  randomBtn.title = t('randomTitle'); randomBtn.setAttribute('aria-label', t('randomTitle'));
  const ambientBtn = document.getElementById('ambientToggle');
  const ambientLabel = ambientOn ? t('ambientOff') : t('ambientOn');
  ambientBtn.title = ambientLabel; ambientBtn.setAttribute('aria-label', ambientLabel);
  const motionBtn = document.getElementById('motionToggle');
  const motionOff = document.documentElement.getAttribute('data-motion') === 'off';
  const motionLabel = motionOff ? t('motionOn') : t('motionOff');
  motionBtn.title = motionLabel; motionBtn.setAttribute('aria-label', motionLabel);
  const cm = document.getElementById('copyMail');
  cm.textContent = tr('Связаться', 'Contact'); cm.dataset.label = cm.textContent; cm.style.minWidth = '';
  document.getElementById('skipLink').textContent = tr('К содержимому', 'Skip to content');
  document.getElementById('footText').textContent = t('footer');
  document.getElementById('footCta').textContent = LANG==='ru' ? 'Связаться с архивом' : 'Get in touch';
  document.getElementById('footYear').textContent = '\u00a9' + new Date().getFullYear();
  const fm = document.getElementById('footMark');
  if(!fm.firstChild){
    fm.innerHTML = 'RELICT'.split('').map(c => '<span>' + c + '</span>').join('');
    fitFootMark();
    if('IntersectionObserver' in window){ new IntersectionObserver((e,o) => { if(e[0].isIntersecting){ fm.classList.add('in'); o.disconnect(); } }, {threshold:.2}).observe(fm); }
    else fm.classList.add('in');
  }
}

/* ---------- footer wordmark: fit to container width, like the reference ---------- */
function fitFootMark(){
  const el = document.getElementById('footMark'); if(!el) return;
  const cs = getComputedStyle(el.parentElement);
  const avail = el.parentElement.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  el.style.fontSize = '100px';
  el.style.display = 'inline-block';
  const w = el.getBoundingClientRect().width;
  el.style.display = '';
  if(w) el.style.fontSize = (100 * avail / w * 0.995) + 'px';
}
window.addEventListener('resize', fitFootMark);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(fitFootMark);

/* ---------- ambient audio ---------- */
let ambientOn = false, audioCtx = null, audioNodes = null;
function startAmbient(){
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const ctx = audioCtx;
    const master = ctx.createGain(); master.gain.value = 0.05; master.connect(ctx.destination);
    const osc1 = ctx.createOscillator(); osc1.type='sine'; osc1.frequency.value = 55;
    const osc2 = ctx.createOscillator(); osc2.type='sine'; osc2.frequency.value = 82.5;
    const oscGain = ctx.createGain(); oscGain.gain.value = 0.6;
    osc1.connect(oscGain); osc2.connect(oscGain); oscGain.connect(master);
    const bufSize = ctx.sampleRate * 2;
    const buffer = ctx.createBuffer(1, bufSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i=0;i<bufSize;i++) data[i] = (Math.random()*2-1)*0.3;
    const noise = ctx.createBufferSource(); noise.buffer = buffer; noise.loop = true;
    const noiseFilter = ctx.createBiquadFilter(); noiseFilter.type='lowpass'; noiseFilter.frequency.value = 400;
    const noiseGain = ctx.createGain(); noiseGain.gain.value = 0.4;
    noise.connect(noiseFilter); noiseFilter.connect(noiseGain); noiseGain.connect(master);
    const lfo = ctx.createOscillator(); lfo.frequency.value = 0.07;
    const lfoGain = ctx.createGain(); lfoGain.gain.value = 60;
    lfo.connect(lfoGain); lfoGain.connect(noiseFilter.frequency);
    osc1.start(); osc2.start(); noise.start(); lfo.start();
    audioNodes = { master, osc1, osc2, noise, lfo };
  }catch(e){ /* audio unavailable */ }
}
function stopAmbient(){
  if(!audioNodes) return;
  try{
    audioNodes.master.gain.setTargetAtTime(0, audioCtx.currentTime, 0.2);
    setTimeout(() => { try{ audioNodes.osc1.stop(); audioNodes.osc2.stop(); audioNodes.noise.stop(); audioNodes.lfo.stop(); }catch(e){} audioNodes=null; }, 400);
  }catch(e){}
}

/* ---------- clock ---------- */
function pad(n){ return String(n).padStart(2,'0'); }
function tickClock(){
  const d = new Date();
  const str = `${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}:${pad(d.getUTCSeconds())} UTC`;
  const el = document.getElementById('footClock');
  if(el) el.textContent = str;
}

/* ---------- scroll reveal + counters ---------- */
function animateCount(el){
  const target = parseFloat(el.dataset.count);
  if(isNaN(target)) return;
  const suffix = el.dataset.suffix || '';
  const dur = 900, t0 = performance.now();
  function tick(now){
    const p = Math.min(1, (now-t0)/dur);
    const eased = 1 - Math.pow(1-p, 3);
    el.textContent = fmtInt(Math.round(target*eased)) + suffix;
    if(p < 1) requestAnimationFrame(tick); else el.textContent = fmtInt(target) + suffix;
  }
  requestAnimationFrame(tick);
}
function observeReveals(root){
  const els = root.querySelectorAll('[data-reveal]');
  if(!els.length) return;
  if(!('IntersectionObserver' in window) || window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    els.forEach(el => { el.classList.add('in'); const c = el.querySelector('[data-count]'); if(c) animateCount(c); });
    return;
  }
  const io = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if(entry.isIntersecting){
        entry.target.classList.add('in');
        const counter = entry.target.querySelector('[data-count]');
        if(counter) animateCount(counter);
        io.unobserve(entry.target);
      }
    });
  }, { threshold:.15, rootMargin:'0px 0px -60px 0px' });
  els.forEach(el => io.observe(el));
}

/* ---------- magnetic buttons ---------- */
function wireMagnetic(root){
  root.querySelectorAll('[data-magnetic]').forEach(el => {
    if(el._magneticBound) return;
    el._magneticBound = true;
    if(window.matchMedia('(pointer: coarse)').matches) return;
    el.addEventListener('mousemove', e => {
      const r = el.getBoundingClientRect();
      const mx = e.clientX - (r.left + r.width/2), my = e.clientY - (r.top + r.height/2);
      el.style.transform = `translate(${mx*0.28}px, ${my*0.28}px)`;
    });
    el.addEventListener('mouseleave', () => { el.style.transform = ''; });
  });
}

/* ---------- custom cursor ---------- */
function initCursor(){
  const cur = document.getElementById('cursor'), label = cur.querySelector('.c-label'), lag = cur.querySelector('.c-lag');
  const peek = document.getElementById('peek'), peekImg = peek.querySelector('img');
  if(!window.matchMedia('(hover:hover) and (pointer:fine)').matches){ cur.remove(); peek.remove(); return; }
  const root = document.documentElement;
  const enabled = () => root.dataset.motion !== 'off' && !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let x = innerWidth / 2, y = innerHeight / 2, cx = x, cy = y, px = x, py = y;
  let state = '', text = '', peekId = '', seen = false, running = false;
  const T = {
    view: () => tr('Открыть', 'View'),
    drag: () => tr('Тяни', 'Drag'),
    prev: () => '←', next: () => '→'
  };
  function setState(s, txt){
    if(s !== state){ state = s; if(s) cur.dataset.state = s; else delete cur.dataset.state; }
    if(txt !== text){ text = txt; label.textContent = txt; }
  }
  function setPeek(id){
    if(id === peekId) return;
    peekId = id;
    if(id){ const src = 'img/' + id + '/1-sm.jpg'; if(!peekImg.src.endsWith(src)) peekImg.src = src; peek.classList.add('on'); start(); }
    else peek.classList.remove('on');
  }
  function pick(t){
    if(!t || !t.closest) return;
    if(t.closest('input, textarea')){ cur.classList.remove('on'); setPeek(''); return; }
    if(enabled() && seen) cur.classList.add('on');
    let s = '', txt = '', pk = '';
    if(t.closest('.hg-nav .prev')){ s = 'prev'; txt = T.prev(); }
    else if(t.closest('.hg-nav .next')){ s = 'next'; txt = T.next(); }
    else if(t.closest('.home-gallery')){ s = 'view'; txt = T.view(); }
    else if(t.closest('a.card')){ s = 'view'; txt = T.view(); }
    else if(t.closest('[data-peek]')){ s = 'row'; pk = t.closest('[data-peek]').dataset.peek; }
    else if(t.closest('.map-pin')){ s = 'link'; }
    else if(t.closest('.map-stage') && !t.closest('.map-controls')){ s = 'drag'; txt = T.drag(); }
    else if(t.closest('a, button, [role="button"], select, label, summary')){ s = 'link'; }
    setState(s, txt); setPeek(pk);
  }
  function frame(){
    cx += (x - cx) * .22; cy += (y - cy) * .22;
    px += (x - px) * .12; py += (y - py) * .12;
    cur.style.transform = 'translate3d(' + x + 'px,' + y + 'px,0)';
    lag.style.transform = 'translate3d(' + (cx - x).toFixed(1) + 'px,' + (cy - y).toFixed(1) + 'px,0)';
    if(peekId || peek.classList.contains('on')){
      const w = peek.offsetWidth, h = peek.offsetHeight;
      let tx = px + 28, ty = py - h / 2;
      if(tx + w > innerWidth - 12) tx = px - 28 - w;
      ty = Math.max(12, Math.min(innerHeight - h - 12, ty));
      peek.style.transform = 'translate3d(' + tx.toFixed(1) + 'px,' + ty.toFixed(1) + 'px,0)';
    }
    if(Math.abs(x - cx) + Math.abs(y - cy) + Math.abs(x - px) + Math.abs(y - py) > .4 || peekId){ requestAnimationFrame(frame); }
    else running = false;
  }
  function start(){ if(!running){ running = true; requestAnimationFrame(frame); } }
  function sync(){
    const on = enabled();
    root.classList.toggle('has-cursor', on);
    if(!on){ cur.classList.remove('on'); setPeek(''); }
  }
  window.syncCursor = sync; sync();
  window.addEventListener('mousemove', e => {
    x = e.clientX; y = e.clientY;
    if(!seen){ seen = true; cx = px = x; cy = py = y; }
    cur.style.transform = 'translate3d(' + x + 'px,' + y + 'px,0)';   /* arrow tracks the pointer with zero lag */
    pick(e.target); start();
  }, { passive:true });
  let scrollTick = false;
  window.addEventListener('scroll', () => {
    if(scrollTick || !seen) return; scrollTick = true;
    requestAnimationFrame(() => { scrollTick = false; pick(document.elementFromPoint(x, y)); });
  }, { passive:true });
  window.addEventListener('hashchange', () => setTimeout(() => { if(seen) pick(document.elementFromPoint(x, y)); }, 450));
  window.addEventListener('mousedown', () => cur.classList.add('down'));
  window.addEventListener('mouseup', () => cur.classList.remove('down'));
  document.addEventListener('mouseleave', () => { cur.classList.remove('on'); setPeek(''); });
  document.addEventListener('mouseenter', () => { if(enabled() && seen) cur.classList.add('on'); });
}

/* ---------- intro loader ---------- */
function runIntro(){
  const loader = document.getElementById('loader');
  const seen = (() => { try{ return sessionStorage.getItem('relict-intro'); }catch(e){ return null; } })();
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches || document.documentElement.dataset.motion === 'off';
  if(seen || reduced){
    loader.remove();
    requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.remove('loading')));
    return;
  }
  try{ sessionStorage.setItem('relict-intro','1'); }catch(e){}
  const word = document.getElementById('loaderWord');
  'RELICT'.split('').forEach((ch,i) => {
    const span = document.createElement('span');
    span.textContent = ch; span.style.animationDelay = (.15 + i*0.07)+'s';
    word.appendChild(span);
  });
  document.getElementById('loaderTag').textContent = t('tagline');
  const pct = document.getElementById('loaderPct');
  const heroReady = () => {
    const im = document.querySelector('#homeGallery .hg-item img');
    if(!im) return Promise.resolve();
    return Promise.race([(im.decode ? im.decode() : Promise.resolve()).catch(() => {}), new Promise(r => setTimeout(r, 4500))])
      .then(() => { im.classList.add('loaded'); });
  };
  const HOLD = 2100;                      /* wordmark rises (~1s), holds, counter runs */
  const t0 = performance.now();
  (function tick(now){
    const p = Math.min(1, (now - t0) / HOLD);
    pct.textContent = String(Math.round((1 - Math.pow(1-p,3)) * 100)).padStart(2,'0');
    if(p < 1) requestAnimationFrame(tick); else heroReady().then(finish);
  })(t0);
  function finish(){
    loader.classList.add('out');                                      /* curtain lifts (.9s) */
    setTimeout(() => document.body.classList.remove('loading'), 260); /* page un-blurs underneath */
    setTimeout(() => loader.remove(), 1000);
  }
}

/* ---------- motion toggle ---------- */
function getMotionPref(){
  try{ return localStorage.getItem('relict-motion'); }catch(e){ return null; }
}
function setMotionPref(v){
  try{ localStorage.setItem('relict-motion', v); }catch(e){}
  document.documentElement.setAttribute('data-motion', v);
  if(window.syncCursor) window.syncCursor();
}

/* ---------- init ---------- */
document.body.classList.add('loading');
document.documentElement.setAttribute('lang', LANG);
if(getMotionPref()==='off') document.documentElement.setAttribute('data-motion','off');
renderChrome();
route();
window.addEventListener('hashchange', route);
document.querySelectorAll('#langSwitch button').forEach(btn => btn.addEventListener('click', () => setLang(btn.dataset.lang)));
document.getElementById('randomBtn').addEventListener('click', () => {
  const pick = SITES[Math.floor(Math.random()*SITES.length)];
  location.hash = '#site-' + pick.id;
});
document.getElementById('ambientToggle').addEventListener('click', function(){
  ambientOn = !ambientOn;
  this.classList.toggle('on', ambientOn);
  this.setAttribute('aria-pressed', String(ambientOn));
  if(ambientOn) startAmbient(); else stopAmbient();
  renderChrome();
});
document.getElementById('motionToggle').addEventListener('click', function(){
  const off = document.documentElement.getAttribute('data-motion') === 'off';
  setMotionPref(off ? 'on' : 'off');
  this.classList.toggle('on', !off);
  this.setAttribute('aria-pressed', String(!off));
  renderChrome();
});
if(document.documentElement.getAttribute('data-motion')==='off'){
  const mb = document.getElementById('motionToggle'); mb.classList.add('on'); mb.setAttribute('aria-pressed','true');
}
document.getElementById('app').addEventListener('click', e => {
  if(e.target && e.target.id === 'heroRandom'){
    const pick = SITES[Math.floor(Math.random()*SITES.length)];
    location.hash = '#site-' + pick.id;
  }
});
document.getElementById('copyMail').addEventListener('click', function(){
  const btn = this, label = btn.dataset.label;
  btn.style.minWidth = btn.offsetWidth + 'px';
  const done = () => { btn.textContent = tr('Скопировано', 'Copied'); setTimeout(() => { btn.textContent = label; }, 1700); };
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText('dossier@relict.archive').then(done).catch(done); else done();
});
window.addEventListener('scroll', () => document.body.classList.toggle('scrolled', window.scrollY > 24), { passive:true });
tickClock();
setInterval(tickClock, 1000);
window.addEventListener('resize', () => { mountRings(document.getElementById('app')); });
initCursor();
runIntro();
</script>
